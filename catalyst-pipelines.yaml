# ==============================================================================
# Pramaan CI/CD Pipeline Configuration
# ==============================================================================
# Automatic trigger on push for all test stages.
# Deployment step requires manual execution / console approval (when: manual).
# ==============================================================================

pipeline-runner: runner_medium

runners:
  runner_medium:
    config-id: 2 # 2GB RAM, 1.2 vCPU, standard runner for Python/Node tests

variables:
  # Mandatory variable for CLI deployments
  CATALYST_TOKEN: '« env.CATALYST_TOKEN »'

stages:
  - name: test_stage
    jobs:
      - name: run_unit_tests
        steps:
          # The deployed backend is the unified AppSail app (see catalyst.json),
          # so its suite is what gates a release. Split into named steps so a
          # regression in any area is visible by step name, not buried.
          - name: AppSail Core API Tests (RBAC, ER, case-twin EN+KN, embeddings)
            cmd: |
              cd appsail
              pip install -r requirements.txt
              python -m unittest test_appsail.AppSailUnifiedTests -v
              cd ..
          - name: Graph Analytics Tests (priority scoring + hotspots, hand-reproducible)
            cmd: |
              cd appsail
              python -m unittest test_appsail.GraphAnalyticsTests -v
              cd ..
          - name: PDF Export Tests (ConversationLog + SmartBrowz dossier/conversation)
            cmd: |
              cd appsail
              python -m unittest test_appsail.ExportTests -v
              cd ..
          - name: Rate Limit + Role Tests (limiter fires; Policy role string)
            cmd: |
              cd appsail
              python -m unittest test_appsail.RateLimitAndRoleTests -v
              cd ..
          - name: Public Assistant Isolation Scanner (served path)
            cmd: python appsail/static/public-assistant/test_isolation.py

          # Legacy standalone-function tree. Not deployed by catalyst.json --
          # kept green while it still exists; drop these once it is removed.
          - name: Entity Resolution Unit Tests (legacy)
            cmd: python functions/entity_resolution_fn/test_entity_resolution.py
          - name: Case Twin Unit Tests (legacy)
            cmd: python functions/case_twin_fn/test_case_twin.py
          - name: RBAC Gateway Unit Tests (legacy)
            cmd: python functions/gateway_fn/test_rbac.py
          - name: GDS Graph & Priority Unit Tests (legacy)
            cmd: python functions/graph_fn/test_graph.py

  - name: deploy_stage
    jobs:
      - name: promote_to_production
        # Gated to prevent automatic deployments to Production
        when: manual
        steps:
          - name: Production Build React Frontend
            cmd: |
              cd client_src
              npm install
              npm run build
              cd ..
          - name: Deploy functions and static hosting to Production
            cmd: catalyst deploy --prod --token $CATALYST_TOKEN
